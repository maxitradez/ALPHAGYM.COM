<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Reset password · Alpha Gym</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<style>
.reset-wrap{width:min(440px,calc(100% - 32px));margin:10vh auto}
.reset-wrap .card{padding:24px}
.reset-wrap input{width:100%;margin:7px 0 14px}
.reset-wrap label{display:block;font-size:.85rem;color:var(--mut)}
.reset-msg{min-height:24px;margin:8px 0;color:var(--mut);font-size:.88rem}
</style>
</head>
<body>
<div class="nav"><div class="wrap"><a class="logo" href="index.html"><span>Alpha</span> Gym</a><nav><a href="app.html">Management login</a></nav></div></div>
<main class="reset-wrap">
  <div class="card">
    <h2>Set a new password</h2>
    <p class="mut">Choose a new password for your Alpha Gym account.</p>
    <div id="reset-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password">
      <button class="btn block" id="save-password">Update password</button>
    </div>
    <p class="reset-msg" id="message">Verifying your secure reset link…</p>
    <a class="btn ghost block" href="app.html">Back to management login</a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client = window.supabase.createClient(
  'https://phphtxrgnpemnspuvjhi.supabase.co',
  'sb_publishable_62JzTKTeK4xuVUIHoLvcCw_Z6oodjkF'
);
const form = document.getElementById('reset-form');
const message = document.getElementById('message');
const button = document.getElementById('save-password');
let ready = false;
async function checkSession() {
  const { data, error } = await client.auth.getSession();
  if (error || !data.session) {
    message.textContent = 'This reset link is invalid or has expired. Return to management login and request a new one.';
    return;
  }
  ready = true;
  form.hidden = false;
  message.textContent = 'Your reset link is verified. Enter your new password below.';
}
client.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') checkSession();
});
checkSession();
button.addEventListener('click', async () => {
  if (!ready) return;
  const password = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  if (password.length < 8) { message.textContent = 'Use at least 8 characters.'; return; }
  if (password !== confirm) { message.textContent = 'The passwords do not match.'; return; }
  button.disabled = true; button.textContent = 'Updating…';
  const { error } = await client.auth.updateUser({ password });
  if (error) {
    message.textContent = error.message;
    button.disabled = false; button.textContent = 'Update password';
    return;
  }
  message.textContent = 'Password updated successfully. You can now sign in.';
  form.hidden = true;
  await client.auth.signOut();
  setTimeout(() => location.href = 'app.html', 1400);
});
</script>
</body>
</html>
